<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Banc d'essai — la ville en 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font:12px/1.45 system-ui,"Segoe UI",sans-serif;color:#e6e6e6}
canvas#gl{display:block;width:100%;height:100%}
#hud{position:fixed;left:8px;top:8px;background:rgba(10,12,16,.62);padding:7px 10px;border-radius:5px;white-space:pre;pointer-events:none;max-width:46vw}
#bar{position:fixed;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar button,#bar select{font:inherit;color:#e6e6e6;background:rgba(10,12,16,.72);border:1px solid #556;border-radius:4px;padding:4px 9px;cursor:pointer}
#bar button:hover{background:#2a3140}
#bar label{background:rgba(10,12,16,.62);padding:4px 8px;border-radius:4px}
#mini{position:fixed;right:10px;top:10px;border:2px solid rgba(255,255,255,.75);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
body.shot #hud,body.shot #bar{display:none}
body.nomap #mini{display:none}
#carte{display:none;position:fixed;inset:0;background:#e8e4dc}
body.carte #carte{display:block}
body.carte #mini,body.carte #hud,body.carte #bar{display:none}
</style></head>
<body class="nomap">
<canvas id="gl"></canvas>
<canvas id="mini" width="230" height="230"></canvas>
<canvas id="carte"></canvas>
<div id="hud">chargement…</div>
<div id="bar"></div>
<script type="module" src="./world.ts"></script>
</body></html>
