<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Banc d'essai — cartes et commandement</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    color-scheme: dark;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; color: #e8ecf3; }
  body { position: fixed; inset: 0; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.4; }
  /* Même structure que index.html : #game (canevas 3D) sous #ui (interface, transparente aux clics là où elle est vide). */
  #game, #ui { position: absolute; inset: 0; overflow: hidden; }
  #game { z-index: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #ui { z-index: 10; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #boot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 99; font-size: 14px; color: #9aabc9; text-align: center;
    white-space: pre-line; max-width: 80vw; }
  #boot.is-off { display: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"></div>
<div id="boot">Chargement du banc d'essai…</div>
<script type="module" src="./command.ts"></script>
</body>
</html>
