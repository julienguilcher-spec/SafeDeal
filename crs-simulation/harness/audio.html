<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc d'essai — moteur sonore</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0e14; color: #e8edf5; font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid #263042; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; position: sticky; top: 0; background: #0b0e14f2; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; }
  header .state { font: 12px monospace; color: #9fb0c8; }
  main { padding: 12px 16px 60px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { border: 1px solid #263042; border-radius: 8px; padding: 10px 12px 12px; background: #111622; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb0c8; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px; }
  button { font: inherit; color: #e8edf5; background: #1b2434; border: 1px solid #33415a; border-radius: 6px; padding: 7px 9px; text-align: left; cursor: pointer; min-height: 36px; }
  button:hover { background: #243149; }
  button.on { background: #1f5fbf; border-color: #5a9bff; }
  button small { display: block; color: #9fb0c8; font: 11px monospace; }
  label { display: grid; grid-template-columns: 132px minmax(0, 1fr) 54px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
  label output { font: 12px monospace; color: #9fb0c8; text-align: right; }
  input[type=range] { width: 100%; }
  select, input[type=text] { box-sizing: border-box; font: inherit; background: #1b2434; color: #e8edf5; border: 1px solid #33415a; border-radius: 6px; padding: 5px 6px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  canvas { display: block; max-width: 100%; }
  #scope { width: 100%; height: 150px; background: #05070b; border-radius: 6px; }
  #board { margin-top: 8px; }
  .hint { color: #9fb0c8; font-size: 12px; margin: 4px 0 8px; }
  pre { font: 11px/1.35 monospace; color: #9fb0c8; margin: 6px 0 0; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Banc d'essai — moteur sonore</h1>
  <span class="state" id="state">initialisation…</span>
</header>
<main>
  <div id="left"></div>
  <div id="right"></div>
</main>
<canvas id="board" width="10" height="10"></canvas>
<script type="module" src="./audio.ts"></script>
</body>
</html>
