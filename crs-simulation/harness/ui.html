<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Banc d'essai — interface</title>
<style>
  :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; color: #e8ecf3; }
  body { position: fixed; inset: 0; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 1.4; }
  /* Même structure que index.html : #game (canevas) sous #ui (interface, transparente aux clics là où elle est vide). */
  #game, #ui { position: absolute; inset: 0; overflow: hidden; }
  #game { z-index: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #ui { z-index: 10; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  /* Panneau du banc d'essai (hors de #ui : il ne fait pas partie de l'interface testée). */
  #bench { position: absolute; right: 8px; bottom: 8px; z-index: 100; width: 300px; max-height: calc(100% - 16px); overflow: auto;
    background: rgba(20, 12, 28, .94); border: 1px solid #6b4a86; border-radius: 10px; padding: 8px 10px 10px; font-size: 12px; }
  #bench.hidden { display: none; }
  #bench h1 { font-size: 12px; margin: 0 0 6px; letter-spacing: .08em; text-transform: uppercase; color: #d9b8f5; }
  #bench label { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 6px; margin: 3px 0; color: #c9b6dc; }
  #bench select, #bench button, #bench input[type=range] { font: inherit; color: #f1e8fa; background: #2a1b38; border: 1px solid #6b4a86; border-radius: 5px;
    padding: 3px 6px; min-height: 24px; width: 100%; box-sizing: border-box; }
  #bench .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
  #bench button { cursor: pointer; padding: 3px 4px; }
  #bench-toggle { position: absolute; right: 8px; bottom: 8px; z-index: 99; font: 600 11px system-ui, sans-serif; color: #f1e8fa; background: rgba(42, 27, 56, .9);
    border: 1px solid #6b4a86; border-radius: 10px; padding: 3px 10px; cursor: pointer; }
  #bench-toggle.hidden { display: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"></div>
<button id="bench-toggle" type="button">Banc d'essai</button>
<div id="bench" class="hidden">
  <h1>Banc d'essai — interface</h1>
  <label>Écran <select id="b-screen">
    <option value="menu_principal">Accueil</option><option value="hud">HUD (partie en cours)</option><option value="pause">Pause</option>
    <option value="parametres">Paramètres</option><option value="chargement">Chargement</option><option value="debrief">Compte rendu</option>
    <option value="credits">Crédits</option>
  </select></label>
  <label>Rôle <select id="b-role"></select></label>
  <label>Situation <select id="b-situation">
    <option value="calme">Cortège calme</option><option value="tension">Tension, sommations</option><option value="affrontement">Affrontements</option>
  </select></label>
  <label>Véhicule <select id="b-vehicle">
    <option value="">À pied</option><option value="centaure">Centaure (tourelle)</option><option value="canon_eau">Canon à eau</option>
    <option value="fourgon_crs">Fourgon (conducteur)</option><option value="moto_bravm">Moto BRAV-M</option>
  </select></label>
  <label>Caméra <select id="b-camera">
    <option value="tps">3ᵉ personne</option><option value="fps">1ʳᵉ personne</option><option value="drone">Drone</option><option value="viewfinder">Viseur</option>
  </select></label>
  <label>Gaz <input id="b-gas" type="range" min="0" max="100" value="0"></label>
  <label>Heure <input id="b-hour" type="range" min="0" max="23.5" step="0.5" value="14.5"></label>
  <div class="row">
    <button id="b-hit" type="button">Coup reçu</button><button id="b-notify" type="button">Notification</button><button id="b-radio" type="button">Radio</button>
    <button id="b-banner" type="button">Bandeau</button><button id="b-prompt" type="button">Invite</button><button id="b-touch" type="button">Tactile</button>
  </div>
</div>
<script type="module" src="./ui.ts"></script>
</body>
</html>
